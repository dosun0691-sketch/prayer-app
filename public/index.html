<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>함께 기도 달성표</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7a4e2d">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="기도 달성표">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#f5f2ec; --card:#fffdf8; --fg:#23211d; --muted:#6c665c; --line:#e2dccf;
  --accent:#7a4e2d; --accent-soft:#efe3d6; --good:#2f6b46; --warn:#9a6a12;
  --display:"Gowun Batang",Georgia,serif; --body:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--bg:#1a1815;--card:#24211d;--fg:#ece6da;--muted:#a59d8f;--line:#3a352e;--accent:#d9a77c;--accent-soft:#3a2e24;--good:#7cc497;--warn:#e0b25a;color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1{font-family:var(--display);font-size:26px;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.pct-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pct{display:grid;gap:4px}
.pct .lbl{font-size:12px;letter-spacing:.06em;color:var(--muted)}
.pct .num{font-family:var(--mono);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.pct .num.today{color:var(--accent)}
.pct .det{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;width:0}
h2{font-size:15px;margin:0 0 10px;font-weight:600}
form{display:grid;gap:10px}
.fields{display:grid;grid-template-columns:1.3fr 1fr .8fr;gap:8px}
@media (max-width:420px){.fields{grid-template-columns:1fr 1fr}.fields .full{grid-column:1/-1}}
label{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input,select{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 14px;background:var(--accent);color:var(--card);cursor:pointer}
button:disabled{opacity:.5}
.msg{font-size:13px;min-height:1.2em;color:var(--muted)}
.msg.ok{color:var(--good)} .msg.err{color:var(--warn)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right} td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--accent-soft);color:var(--accent)}
.chip.full{background:transparent;color:var(--good);border:1px solid var(--good)}
.empty{color:var(--muted);font-size:13px;padding:6px 0;white-space:normal}
.note{font-size:12px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .5s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>함께 기도 달성표</h1>
    <p class="sub" id="goalLine">신자 명단을 불러오는 중…</p>
  </header>

  <section class="card" aria-label="전체 목표 달성률">
    <div class="pct-row">
      <div class="pct"><span class="lbl">오늘</span><span class="num today" id="pToday">–</span><span class="det" id="dToday">기록을 불러오는 중</span><div class="bar"><i id="bToday"></i></div></div>
      <div class="pct"><span class="lbl">어제</span><span class="num" id="pYest">–</span><span class="det" id="dYest">&nbsp;</span><div class="bar"><i id="bYest"></i></div></div>
    </div>
  </section>

  <section class="card">
    <h2>기도 시간 기록</h2>
    <form id="f">
      <div class="fields">
        <label class="full">이름<select id="fName" required></select></label>
        <label>날짜<input id="fDate" type="date" required></label>
        <label>기도시간(분)<input id="fMin" type="number" min="0" max="1440" step="1" inputmode="numeric" required placeholder="60"></label>
      </div>
      <button id="fSave" type="submit">기록하기</button>
      <div class="msg" id="fMsg" role="status"></div>
    </form>
  </section>

  <section class="card">
    <h2>기록표 <span class="note">(최근 14일)</span></h2>
    <div class="tbl"><table>
      <thead><tr><th>이름</th><th>날짜</th><th class="n">기도시간</th><th class="n">전체 목표 달성률</th></tr></thead>
      <tbody id="rows"><tr><td colspan="4" class="empty">아직 기록이 없습니다. 위에서 이름과 기도시간을 넣고 ‘기록하기’를 누르면 여기에 나타납니다.</td></tr></tbody>
    </table></div>
  </section>
  <p class="note">달성률 = 그날 신자들이 기도한 시간의 합 ÷ 모든 신자의 하루 목표 합. 같은 사람이 같은 날 다시 기록하면 새 값으로 바뀝니다. 휴대폰에 앱으로 설치하는 방법: <a href="install.html" style="color:var(--accent)">설치 안내 (안드로이드·아이폰)</a></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, collection, query, where, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyAALHdScHzNF3iWGXn9JS6YjLya0NBjPW4",
  authDomain: "ourfamily-prayer-11060015.firebaseapp.com",
  projectId: "ourfamily-prayer-11060015",
  appId: "1:1029683333155:web:4675bfed8d72e770d34996",
  messagingSenderId: "1029683333155"
});
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const dstr = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return dstr(d); };
const fmtMin = m => { m = +m || 0; const h = Math.floor(m / 60), r = m % 60; return h ? h + "시간" + (r ? " " + r + "분" : "") : r + "분"; };
let members = [], entries = [];

const totalGoal = () => members.reduce((s, m) => s + (+m.goal || 0), 0);
const ids = () => new Set(members.map(m => m.id));
function pctFor(date) {
  const g = totalGoal(), keep = ids();
  const sum = entries.filter(e => e.date === date && keep.has(e.member)).reduce((s, e) => s + e.minutes, 0);
  return { sum, g, p: g ? Math.round(sum / g * 100) : 0 };
}
function render() {
  const t = pctFor(daysAgo(0)), y = pctFor(daysAgo(1));
  $("pToday").textContent = t.p + "%"; $("dToday").textContent = fmtMin(t.sum) + " / " + fmtMin(t.g);
  $("pYest").textContent = y.p + "%"; $("dYest").textContent = fmtMin(y.sum) + " / " + fmtMin(y.g);
  $("bToday").style.width = Math.min(100, t.p) + "%"; $("bYest").style.width = Math.min(100, y.p) + "%";
  $("goalLine").textContent = "신자 " + members.length + "명 · 전체 하루 목표 " + fmtMin(totalGoal());
  const s = $("fName"), cur = s.value; s.textContent = "";
  members.forEach(m => { const o = document.createElement("option"); o.value = m.id; o.textContent = m.name + " (목표 " + m.goal + "분)"; s.appendChild(o); });
  let saved = null; try { saved = localStorage.getItem("prayer.member"); } catch (e) {}
  if (cur && members.some(m => m.id === cur)) s.value = cur; else if (saved && members.some(m => m.id === saved)) s.value = saved;
  const name = id => (members.find(m => m.id === id) || {}).name;
  const tb = $("rows"); tb.textContent = "";
  const list = entries.filter(e => name(e.member)).sort((a, b) => b.date.localeCompare(a.date) || name(a.member).localeCompare(name(b.member), "ko"));
  if (!list.length) { const tr = document.createElement("tr"); const td = document.createElement("td"); td.colSpan = 4; td.className = "empty"; td.textContent = "아직 기록이 없습니다. 위에서 이름과 기도시간을 넣고 ‘기록하기’를 누르면 여기에 나타납니다."; tr.appendChild(td); tb.appendChild(tr); return; }
  list.forEach(e => {
    const tr = document.createElement("tr"), p = pctFor(e.date).p;
    [name(e.member), e.date, fmtMin(e.minutes)].forEach((v, i) => { const td = document.createElement("td"); td.textContent = v; if (i === 2) td.className = "n"; tr.appendChild(td); });
    const td = document.createElement("td"); td.className = "n"; const c = document.createElement("span"); c.className = "chip" + (p >= 100 ? " full" : ""); c.textContent = p + "%"; td.appendChild(c); tr.appendChild(td);
    tb.appendChild(tr);
  });
}

$("fDate").value = daysAgo(0);
const timer = setTimeout(() => { $("dToday").textContent = "인터넷 연결을 확인해 주세요."; }, 10000);
onSnapshot(doc(db, "config", "group"), s => {
  const d = s.exists() ? s.data() : null;
  members = (d && Array.isArray(d.members)) ? d.members.map(m => ({ id: String(m.id), name: String(m.name), goal: +m.goal || 0 })) : [];
  render();
}, () => { $("goalLine").textContent = "신자 명단을 불러오지 못했습니다."; });
onSnapshot(query(collection(db, "entries"), where("date", ">=", daysAgo(13))), s => {
  clearTimeout(timer);
  entries = s.docs.map(d => d.data()).map(e => ({ date: String(e.date), member: String(e.member), minutes: +e.minutes || 0 }));
  render();
}, () => { clearTimeout(timer); $("dToday").textContent = "기록을 불러오지 못했습니다."; });

const msg = (t, cls) => { const el = $("fMsg"); el.textContent = t; el.className = "msg" + (cls ? " " + cls : ""); };
$("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const member = $("fName").value, date = $("fDate").value, minutes = Math.round(+$("fMin").value);
  if (!member || !/^\d{4}-\d{2}-\d{2}$/.test(date) || !(minutes >= 0 && minutes <= 1440)) { msg("이름, 날짜, 기도시간(0~1440분)을 확인해 주세요.", "err"); return; }
  try { localStorage.setItem("prayer.member", member); } catch (e) {}
  $("fSave").disabled = true;
  try {
    await setDoc(doc(db, "entries", date + "_" + member), { date, member, minutes });
    const nm = (members.find(m => m.id === member) || {}).name || "";
    msg(nm + " · " + date + " · " + fmtMin(minutes) + " 기록했습니다.", "ok"); $("fMin").value = "";
  } catch (e) { msg("저장하지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요.", "err"); }
  finally { $("fSave").disabled = false; }
});
</script>
</body>
</html>
