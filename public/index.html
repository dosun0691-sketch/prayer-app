<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>함께 기도 달성표 · 一起禱告達成表</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7a4e2d">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="기도 달성표">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#f5f2ec; --card:#fffdf8; --fg:#23211d; --muted:#6c665c; --line:#e2dccf;
  --accent:#7a4e2d; --accent-soft:#efe3d6; --good:#2f6b46; --warn:#9a6a12;
  --display:"Gowun Batang","Noto Serif TC",Georgia,serif; --body:"IBM Plex Sans KR","Malgun Gothic","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--bg:#1a1815;--card:#24211d;--fg:#ece6da;--muted:#a59d8f;--line:#3a352e;--accent:#d9a77c;--accent-soft:#3a2e24;--good:#7cc497;--warn:#e0b25a;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-family:var(--display);font-size:26px;margin:0;text-wrap:balance}
.lang{flex:none;font:inherit;font-size:13px;font-weight:600;background:transparent;color:var(--accent);border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer}
.sub{color:var(--muted);margin:2px 0 0;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.pct-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pct{display:grid;gap:4px}
.pct .lbl{font-size:12px;letter-spacing:.06em;color:var(--muted)}
.pct .num{font-family:var(--mono);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.pct .num.today{color:var(--accent)}
.pct .det{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;width:0}
h2{font-size:15px;margin:0 0 10px;font-weight:600}
form{display:grid;gap:10px}
.fields{display:grid;grid-template-columns:1.3fr 1fr .8fr;gap:8px}
@media (max-width:420px){.fields{grid-template-columns:1fr 1fr}.fields .full{grid-column:1/-1}}
label{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input,select{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.main{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 14px;background:var(--accent);color:var(--card);cursor:pointer}
button:disabled{opacity:.5}
.msg{font-size:13px;min-height:1.2em;color:var(--muted)}
.msg.ok{color:var(--good)} .msg.err{color:var(--warn)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right} td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--accent-soft);color:var(--accent)}
.chip.full{background:transparent;color:var(--good);border:1px solid var(--good)}
.empty{color:var(--muted);font-size:13px;padding:6px 0;white-space:normal}
.note{font-size:12px;color:var(--muted);margin:0}
.note a{color:var(--accent)}
.more{margin-top:14px;width:100%;font:inherit;font-weight:600;background:var(--accent-soft);color:var(--accent);border:0;border-radius:10px;padding:11px;cursor:pointer}
.seg{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.seg button{font:inherit;font-size:13px;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--card);border-color:var(--accent)}
tfoot td{font-weight:600;border-bottom:0}
td.zero{color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .5s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 data-t="title">함께 기도 달성표</h1>
      <p class="sub" id="goalLine"></p>
    </div>
    <button type="button" class="lang" id="langBtn" aria-label="Language">中文</button>
  </header>

  <section class="card" data-t-aria="pctAria" aria-label="">
    <div class="pct-row">
      <div class="pct"><span class="lbl" data-t="today">오늘</span><span class="num today" id="pToday">–</span><span class="det" id="dToday"></span><div class="bar"><i id="bToday"></i></div></div>
      <div class="pct"><span class="lbl" data-t="yesterday">어제</span><span class="num" id="pYest">–</span><span class="det" id="dYest">&nbsp;</span><div class="bar"><i id="bYest"></i></div></div>
    </div>
    <button type="button" class="more" id="resBtn" aria-expanded="false" aria-controls="resBox" data-t="resOpen">모두의 결과 보기</button>
  </section>

  <section class="card" id="resBox" hidden>
    <h2 data-t="resTitle">신자별 결과</h2>
    <div class="seg" role="group">
      <button type="button" data-p="0" class="on" data-t="today">오늘</button>
      <button type="button" data-p="1" data-t="yesterday">어제</button>
      <button type="button" data-p="7" data-t="week">최근 7일</button>
    </div>
    <div class="tbl"><table>
      <thead><tr><th data-t="thName">이름</th><th class="n" data-t="thMin">기도시간</th><th class="n" data-t="thGoal">목표</th><th class="n" data-t="thMine">개인 달성률</th></tr></thead>
      <tbody id="resRows"></tbody>
      <tfoot><tr id="resTotal"></tr></tfoot>
    </table></div>
    <p class="note" id="resNote"></p>
  </section>

  <section class="card" id="regBox">
    <h2 data-t="regTitle">처음 오셨나요? 내 이름 등록</h2>
    <form id="r">
      <div class="fields">
        <label class="full"><span data-t="name">이름</span><input id="rName" maxlength="20" required></label>
        <label><span data-t="goalMin">하루 목표(분)</span><input id="rGoal" type="number" min="10" max="600" step="5" inputmode="numeric" value="60" required></label>
      </div>
      <button class="main" id="rSave" type="submit" data-t="regBtn">등록하기</button>
      <div class="msg" id="rMsg" role="status"></div>
      <p class="note" data-t="regNote">한 번만 등록하면 됩니다. 이름이 틀렸거나 지워야 하면 목사님께 말씀해 주세요.</p>
    </form>
  </section>

  <section class="card">
    <h2 data-t="recTitle">기도 시간 기록</h2>
    <form id="f">
      <div class="fields">
        <label class="full"><span data-t="name">이름</span><select id="fName" required></select></label>
        <label><span data-t="date">날짜</span><input id="fDate" type="date" required></label>
        <label><span data-t="minutes">기도시간(분)</span><input id="fMin" type="number" min="0" max="1440" step="1" inputmode="numeric" required placeholder="60"></label>
      </div>
      <button class="main" id="fSave" type="submit" data-t="recBtn">기록하기</button>
      <div class="msg" id="fMsg" role="status"></div>
    </form>
  </section>

  <section class="card">
    <h2><span data-t="tableTitle">기록표</span> <span class="note" data-t="last14">(최근 14일)</span></h2>
    <div class="tbl"><table>
      <thead><tr><th data-t="thName">이름</th><th data-t="thDate">날짜</th><th class="n" data-t="thMin">기도시간</th><th class="n" data-t="thPct">전체 목표 달성률</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>
  <p class="note"><span data-t="formula"></span> <a href="install.html" data-t="installLink">설치 안내 (안드로이드·아이폰)</a></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, collection, query, where, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ---------- language (Korean / Traditional Chinese, Taiwan) ----------
const T = {
  ko: { title:"함께 기도 달성표", today:"오늘", yesterday:"어제", pctAria:"전체 목표 달성률",
    regTitle:"처음 오셨나요? 내 이름 등록", name:"이름", goalMin:"하루 목표(분)", regBtn:"등록하기",
    regNote:"한 번만 등록하면 됩니다. 이름이 틀렸거나 지워야 하면 목사님께 말씀해 주세요.", namePh:"예: 김은혜",
    recTitle:"기도 시간 기록", date:"날짜", minutes:"기도시간(분)", recBtn:"기록하기",
    tableTitle:"기록표", last14:"(최근 14일)", thName:"이름", thDate:"날짜", thMin:"기도시간", thPct:"전체 목표 달성률",
    formula:"달성률 = 그날 신자들이 기도한 시간의 합 ÷ 등록한 모든 신자의 하루 목표 합. 같은 사람이 같은 날 다시 기록하면 새 값으로 바뀝니다.",
    installLink:"휴대폰에 설치하는 방법 (안드로이드·아이폰)", other:"中文",
    resOpen:"모두의 결과 보기", resClose:"결과 닫기", resTitle:"신자별 결과", week:"최근 7일", thGoal:"목표", thMine:"개인 달성률", total:"전체",
    resNote:p=>p===7?"최근 7일 = 오늘 포함 7일. 목표는 하루 목표 × 7일입니다.":"아직 기록하지 않은 사람은 0분으로 보입니다.",
    goalLine:(n,g)=>`등록한 신자 ${n}명 · 전체 하루 목표 ${g}`, noMembers:"아직 등록한 신자가 없습니다. 아래에서 이름을 등록해 주세요.",
    loadingMembers:"신자 명단을 불러오는 중…", loading:"기록을 불러오는 중", netSlow:"인터넷 연결을 확인해 주세요.",
    loadFail:"기록을 불러오지 못했습니다.", membersFail:"신자 명단을 불러오지 못했습니다.",
    empty:"아직 기록이 없습니다. 위에서 이름과 기도시간을 넣고 ‘기록하기’를 누르면 여기에 나타납니다.",
    goalOpt:(n,g)=>`${n} (목표 ${g}분)`, h:"시간", m:"분",
    recBad:"이름, 날짜, 기도시간(0~1440분)을 확인해 주세요.", recOk:(n,d,t)=>`${n} · ${d} · ${t} 기록했습니다.`,
    recFail:"저장하지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요.",
    regBadName:"이름을 1~20자로 적어 주세요.", regBadGoal:"하루 목표는 10분에서 600분 사이로 적어 주세요.",
    regDup:n=>`‘${n}’ 이름이 이미 있습니다. 본인이면 아래 기록 칸에서 이름을 고르세요. 다른 분이면 이름 뒤에 구분(예: 김은혜B)을 붙여 주세요.`,
    regOk:n=>`${n}님, 등록되었습니다. 이제 아래에서 기도 시간을 기록하세요.`, regFail:"등록하지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요." },
  zh: { title:"一起禱告達成表", today:"今天", yesterday:"昨天", pctAria:"全體目標達成率",
    regTitle:"第一次使用嗎？登記我的名字", name:"姓名", goalMin:"每日目標（分鐘）", regBtn:"登記",
    regNote:"只需要登記一次。名字寫錯或需要刪除時，請告訴牧師。", namePh:"例如：王小明",
    recTitle:"記錄禱告時間", date:"日期", minutes:"禱告時間（分鐘）", recBtn:"記錄",
    tableTitle:"紀錄表", last14:"（最近14天）", thName:"姓名", thDate:"日期", thMin:"禱告時間", thPct:"全體目標達成率",
    formula:"達成率 = 當天大家禱告時間的總和 ÷ 所有已登記者每日目標的總和。同一個人同一天再次記錄時，會改成新的數值。",
    installLink:"安裝到手機的方法（Android・iPhone）", other:"한국어",
    resOpen:"查看大家的結果", resClose:"收起結果", resTitle:"每個人的結果", week:"最近7天", thGoal:"目標", thMine:"個人達成率", total:"全體",
    resNote:p=>p===7?"最近7天 = 包含今天共7天。目標為每日目標 × 7天。":"還沒有記錄的人會顯示為0分鐘。",
    goalLine:(n,g)=>`已登記 ${n} 人 · 全體每日目標 ${g}`, noMembers:"還沒有人登記。請在下方登記你的名字。",
    loadingMembers:"正在讀取名單…", loading:"正在讀取紀錄", netSlow:"請確認網路連線。",
    loadFail:"無法讀取紀錄。", membersFail:"無法讀取名單。",
    empty:"還沒有紀錄。在上方選擇姓名、輸入禱告時間後按「記錄」，就會顯示在這裡。",
    goalOpt:(n,g)=>`${n}（目標 ${g} 分鐘）`, h:"小時", m:"分鐘",
    recBad:"請確認姓名、日期、禱告時間（0～1440分鐘）。", recOk:(n,d,t)=>`${n} · ${d} · ${t} 已記錄。`,
    recFail:"儲存失敗。請確認網路連線後再按一次。",
    regBadName:"請輸入1～20個字的名字。", regBadGoal:"每日目標請輸入10到600分鐘。",
    regDup:n=>`「${n}」已經有人登記。如果是你本人，請在下方記錄欄選擇名字；如果是別人，請在名字後面加上區別（例如：王小明B）。`,
    regOk:n=>`${n}，登記完成。現在可以在下方記錄禱告時間。`, regFail:"登記失敗。請確認網路連線後再按一次。" }
};
let lang = "ko";
try { lang = localStorage.getItem("prayer.lang") || ""; } catch (e) {}
if (lang !== "ko" && lang !== "zh") lang = (navigator.languages || [navigator.language || ""]).some(l => /^zh/i.test(l)) ? "zh" : "ko";
const t = k => T[lang][k];
let status = { today: "loading", members: "loadingMembers" };
function applyLang() {
  document.documentElement.lang = lang === "zh" ? "zh-Hant-TW" : "ko";
  document.title = t("title");
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-t-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.tAria)));
  $("rName").placeholder = t("namePh");
  $("langBtn").textContent = t("other");
  $("resBtn").textContent = t($("resBox").hidden ? "resOpen" : "resClose");
  render();
}

// ---------- data ----------
const app = initializeApp({
  apiKey: "AIzaSyAALHdScHzNF3iWGXn9JS6YjLya0NBjPW4",
  authDomain: "ourfamily-prayer-11060015.firebaseapp.com",
  projectId: "ourfamily-prayer-11060015",
  appId: "1:1029683333155:web:4675bfed8d72e770d34996",
  messagingSenderId: "1029683333155"
});
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const newId = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), b => "abcdefghijklmnopqrstuvwxyz0123456789"[b % 36]).join("");
const pad = n => String(n).padStart(2, "0");
const dstr = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return dstr(d); };
const fmtMin = m => { m = +m || 0; const h = Math.floor(m / 60), r = m % 60; return h ? h + t("h") + (r ? " " + r + t("m") : "") : r + t("m"); };
let members = [], entries = [], loadedMembers = false, loadedEntries = false;

const totalGoal = () => members.reduce((s, m) => s + (+m.goal || 0), 0);
function pctFor(date) {
  const g = totalGoal(), keep = new Set(members.map(m => m.id));
  const sum = entries.filter(e => e.date === date && keep.has(e.member)).reduce((s, e) => s + e.minutes, 0);
  return { sum, g, p: g ? Math.round(sum / g * 100) : 0 };
}
function render() {
  const tp = pctFor(daysAgo(0)), y = pctFor(daysAgo(1));
  $("pToday").textContent = loadedEntries ? tp.p + "%" : "–"; $("pYest").textContent = loadedEntries ? y.p + "%" : "–";
  $("dToday").textContent = loadedEntries ? fmtMin(tp.sum) + " / " + fmtMin(tp.g) : t(status.today);
  $("dYest").textContent = loadedEntries ? fmtMin(y.sum) + " / " + fmtMin(y.g) : " ";
  $("bToday").style.width = Math.min(100, tp.p) + "%"; $("bYest").style.width = Math.min(100, y.p) + "%";
  $("goalLine").textContent = !loadedMembers ? t(status.members) : members.length ? t("goalLine")(members.length, fmtMin(totalGoal())) : t("noMembers");
  let mine = null; try { mine = localStorage.getItem("prayer.member"); } catch (e) {}
  $("regBox").hidden = !!(mine && members.some(m => m.id === mine));
  const s = $("fName"), cur = s.value; s.textContent = "";
  members.forEach(m => { const o = document.createElement("option"); o.value = m.id; o.textContent = t("goalOpt")(m.name, m.goal); s.appendChild(o); });
  if (cur && members.some(m => m.id === cur)) s.value = cur; else if (mine && members.some(m => m.id === mine)) s.value = mine;
  renderResults();
  const name = id => (members.find(m => m.id === id) || {}).name;
  const tb = $("rows"); tb.textContent = "";
  const list = entries.filter(e => name(e.member)).sort((a, b) => b.date.localeCompare(a.date) || name(a.member).localeCompare(name(b.member)));
  if (!list.length) { const tr = document.createElement("tr"); const td = document.createElement("td"); td.colSpan = 4; td.className = "empty"; td.textContent = t("empty"); tr.appendChild(td); tb.appendChild(tr); return; }
  list.forEach(e => {
    const tr = document.createElement("tr"), p = pctFor(e.date).p;
    [name(e.member), e.date, fmtMin(e.minutes)].forEach((v, i) => { const td = document.createElement("td"); td.textContent = v; if (i === 2) td.className = "n"; tr.appendChild(td); });
    const td = document.createElement("td"); td.className = "n"; const c = document.createElement("span"); c.className = "chip" + (p >= 100 ? " full" : ""); c.textContent = p + "%"; td.appendChild(c); tr.appendChild(td);
    tb.appendChild(tr);
  });
}

// ---------- per-person results ----------
let period = 0; // 0 = today, 1 = yesterday, 7 = last 7 days incl. today
function renderResults() {
  if ($("resBox").hidden) return;
  const dates = period === 7 ? Array.from({ length: 7 }, (_, i) => daysAgo(i)) : [daysAgo(period)];
  const span = dates.length, set = new Set(dates);
  const rows = members.map(m => {
    const mins = entries.filter(e => e.member === m.id && set.has(e.date)).reduce((s, e) => s + e.minutes, 0);
    const goal = m.goal * span;
    return { name: m.name, mins, goal, p: goal ? Math.round(mins / goal * 100) : 0 };
  }).sort((a, b) => b.p - a.p || a.name.localeCompare(b.name));
  const tb = $("resRows"); tb.textContent = "";
  if (!rows.length) { const tr = document.createElement("tr"); const td = document.createElement("td"); td.colSpan = 4; td.className = "empty"; td.textContent = t("noMembers"); tr.appendChild(td); tb.appendChild(tr); }
  rows.forEach(r => {
    const tr = document.createElement("tr");
    const c1 = document.createElement("td"); c1.textContent = r.name;
    const c2 = document.createElement("td"); c2.className = "n" + (r.mins ? "" : " zero"); c2.textContent = fmtMin(r.mins);
    const c3 = document.createElement("td"); c3.className = "n"; c3.textContent = fmtMin(r.goal);
    const c4 = document.createElement("td"); c4.className = "n"; const chip = document.createElement("span"); chip.className = "chip" + (r.p >= 100 ? " full" : ""); chip.textContent = r.p + "%"; c4.appendChild(chip);
    tr.append(c1, c2, c3, c4); tb.appendChild(tr);
  });
  const sm = rows.reduce((s, r) => s + r.mins, 0), sg = rows.reduce((s, r) => s + r.goal, 0);
  const tot = $("resTotal"); tot.textContent = "";
  [t("total"), fmtMin(sm), fmtMin(sg), (sg ? Math.round(sm / sg * 100) : 0) + "%"].forEach((v, i) => { const td = document.createElement("td"); td.textContent = v; if (i) td.className = "n"; tot.appendChild(td); });
  $("resNote").textContent = t("resNote")(period);
  document.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", +b.dataset.p === period));
}
$("resBtn").addEventListener("click", () => {
  const open = $("resBox").hidden;
  $("resBox").hidden = !open; $("resBtn").setAttribute("aria-expanded", String(open));
  $("resBtn").textContent = t(open ? "resClose" : "resOpen");
  renderResults();
  if (open) $("resBox").scrollIntoView({ behavior: "smooth", block: "start" });
});
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => { period = +b.dataset.p; renderResults(); }));

$("fDate").value = daysAgo(0);
$("langBtn").addEventListener("click", () => { lang = lang === "ko" ? "zh" : "ko"; try { localStorage.setItem("prayer.lang", lang); } catch (e) {} applyLang(); });
applyLang();

const timer = setTimeout(() => { status.today = "netSlow"; render(); }, 10000);
onSnapshot(collection(db, "members"), s => {
  loadedMembers = true;
  members = s.docs.map(d => ({ id: d.id, name: String(d.data().name), goal: +d.data().goal || 0 })).sort((a, b) => a.name.localeCompare(b.name));
  render();
}, () => { status.members = "membersFail"; render(); });
onSnapshot(query(collection(db, "entries"), where("date", ">=", daysAgo(13))), s => {
  clearTimeout(timer); loadedEntries = true;
  entries = s.docs.map(d => d.data()).map(e => ({ date: String(e.date), member: String(e.member), minutes: +e.minutes || 0 }));
  render();
}, () => { clearTimeout(timer); status.today = "loadFail"; render(); });

const say = (id, txt, cls) => { const el = $(id); el.textContent = txt; el.className = "msg" + (cls ? " " + cls : ""); };
$("r").addEventListener("submit", async ev => {
  ev.preventDefault();
  const name = $("rName").value.trim().replace(/\s+/g, " "), goal = Math.round(+$("rGoal").value);
  if (!name || name.length > 20) { say("rMsg", t("regBadName"), "err"); return; }
  if (!(goal >= 10 && goal <= 600)) { say("rMsg", t("regBadGoal"), "err"); return; }
  if (members.some(m => m.name === name)) { say("rMsg", t("regDup")(name), "err"); return; }
  $("rSave").disabled = true;
  const id = newId();
  try {
    await setDoc(doc(db, "members", id), { name, goal });
    try { localStorage.setItem("prayer.member", id); } catch (e) {}
    say("rMsg", t("regOk")(name), "ok"); $("rName").value = "";
    setTimeout(() => { $("fName").value = id; }, 300);
  } catch (e) { say("rMsg", t("regFail"), "err"); }
  finally { $("rSave").disabled = false; }
});
$("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const member = $("fName").value, date = $("fDate").value, minutes = Math.round(+$("fMin").value);
  if (!member || !/^\d{4}-\d{2}-\d{2}$/.test(date) || !(minutes >= 0 && minutes <= 1440)) { say("fMsg", t("recBad"), "err"); return; }
  try { localStorage.setItem("prayer.member", member); } catch (e) {}
  $("fSave").disabled = true;
  try {
    await setDoc(doc(db, "entries", date + "_" + member), { date, member, minutes });
    say("fMsg", t("recOk")((members.find(m => m.id === member) || {}).name || "", date, fmtMin(minutes)), "ok"); $("fMin").value = "";
  } catch (e) { say("fMsg", t("recFail"), "err"); }
  finally { $("fSave").disabled = false; }
});
</script>
</body>
</html>
