<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>함께 기도 달성표 · 一起禱告達成表</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffb4a2">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="기도 달성표">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Noto+Sans+TC:wght@500;700&display=swap">
<style>
/* Concept: a sunny Sunday-school notebook — pastel paper, chunky rounded shapes, praying hands that glow as the group's prayer fills up. */
:root{
  --bg:#fff7ec; --paper:#ffffff; --ink:#4a3b35; --soft:#8a7a70; --line:#f1e3d3;
  --peach:#ffb4a2; --peach-deep:#e8806a; --sun:#ffd166; --sky:#a8d8f0; --mint:#b8e6c8; --mint-deep:#3f9a62; --lilac:#d7c4f0;
  --skin:#ffdcbf; --skin-line:#e7a982; --ring-bg:#fde9da;
  --display:"Jua","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Gowun Dodum","Noto Sans TC","PingFang TC","Microsoft JhengHei","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1d1b2e; --paper:#29263f; --ink:#f5eee6; --soft:#b7adc9; --line:#3a3656;
  --peach:#ff9f8a; --peach-deep:#ffb4a2; --sun:#ffd166; --sky:#7cbfe0; --mint:#8fd6a8; --mint-deep:#8fd6a8; --lilac:#b49ce0;
  --skin:#ffd2b0; --skin-line:#d99a74; --ring-bg:#3a3656; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  background-image:radial-gradient(var(--line) 1.2px,transparent 1.2px);background-size:22px 22px}
.wrap{max-width:540px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0;letter-spacing:.5px}
.lang{flex:none;font-family:var(--display);font-size:15px;background:var(--paper);color:var(--peach-deep);border:2px solid var(--peach);border-radius:99px;padding:4px 14px;cursor:pointer;box-shadow:0 3px 0 var(--peach)}
.sub{color:var(--soft);margin:2px 0 0;font-size:14px}

.church{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--line);flex:none}
.logo img{width:40px;height:40px;display:block}
.cname{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-weight:700;font-size:22px;letter-spacing:2px}
.verse{margin:0;background:var(--paper);border-radius:22px;padding:14px 18px;box-shadow:0 6px 0 var(--line);border-left:6px solid var(--sun)}
.verse blockquote{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-weight:500;font-size:17px;line-height:1.7}
.verse .vko{margin:6px 0 0;font-size:14px;color:var(--soft)}
.verse figcaption{margin-top:6px;font-family:var(--display);font-size:15px;color:var(--peach-deep);text-align:right}
.stats{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.stat{background:var(--bg);border-radius:16px;padding:8px 4px;display:grid;gap:2px}
.stat .k{font-size:12px;color:var(--soft)}
.stat b{font-family:var(--display);font-weight:400;font-size:17px;font-variant-numeric:tabular-nums}
.stat.done b{color:var(--mint-deep)}
/* hero */
.hero{position:relative;background:var(--paper);border-radius:28px;padding:18px 16px 16px;box-shadow:0 6px 0 var(--line);text-align:center;overflow:hidden}
.hero::before{content:"";position:absolute;inset:auto -40px -80px -40px;height:160px;background:var(--sky);opacity:.25;border-radius:50%}
.ring{position:relative;width:220px;max-width:70vw;aspect-ratio:1;margin:0 auto}
.ring svg{width:100%;height:100%;display:block}
.ring .center{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:0}
.hands{width:46%;height:auto}
.big{font-family:var(--display);font-size:40px;line-height:1;margin-top:2px;font-variant-numeric:tabular-nums}
.lbl{font-family:var(--display);font-size:15px;color:var(--peach-deep)}
.cheer{position:relative;font-family:var(--display);font-size:20px;margin:10px 0 2px}
.det{position:relative;font-size:14px;color:var(--soft)}
.yest{position:relative;display:inline-flex;gap:8px;align-items:center;margin-top:10px;background:var(--bg);border-radius:99px;padding:5px 14px;font-size:14px}
.yest b{font-family:var(--display);font-weight:400;font-size:18px}
.sparkle{position:absolute;width:22px;height:22px}
@media (prefers-reduced-motion:no-preference){
  .sparkle{animation:twinkle 2.4s ease-in-out infinite}
  .sparkle.s2{animation-delay:.8s}.sparkle.s3{animation-delay:1.6s}
  @keyframes twinkle{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.6);opacity:.5}}
  #ringFg{transition:stroke-dashoffset .9s cubic-bezier(.3,1.3,.5,1)}
  .bar>i{transition:width .6s ease}
}
.more{position:relative;margin-top:14px;width:100%;font-family:var(--display);font-size:18px;background:var(--sun);color:#4a3b35;border:0;border-radius:18px;padding:12px;cursor:pointer;box-shadow:0 4px 0 #e9b43f}

.btns{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btns .more{margin-top:0;font-size:17px;padding:12px 6px}
.more.alt{background:var(--lilac);color:#3b2d55;box-shadow:0 4px 0 #a98fd6}
.avgcard{text-align:center}
.avgcard .seg{justify-content:center}
.avgbig{font-family:var(--display);font-size:64px;line-height:1;color:var(--peach-deep);font-variant-numeric:tabular-nums;margin:6px 0 10px}
.avgbar{height:14px;max-width:320px;margin:0 auto}
.avgbar>i{background:linear-gradient(90deg,var(--peach),var(--sun))}
.avgline{font-family:var(--display);font-size:18px;margin:12px 0 4px}
/* cards */
.card{background:var(--paper);border-radius:24px;padding:18px 16px;box-shadow:0 6px 0 var(--line)}
.card h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h2 .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}
form{display:grid;gap:12px}
.fields{display:grid;grid-template-columns:1.3fr 1fr .9fr;gap:10px}
@media (max-width:440px){.fields{grid-template-columns:1fr 1fr}.fields .full{grid-column:1/-1}}
label{display:grid;gap:4px;font-size:14px;color:var(--soft);min-width:0}
input,select{font-family:var(--body);font-size:17px;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;min-width:0;max-width:100%}
.fields{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,.9fr)}
@media (max-width:440px){.fields{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
input[type=date]{padding-right:6px}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.main{font-family:var(--display);font-size:20px;border:0;border-radius:18px;padding:13px;cursor:pointer;color:#4a3b35}
.main.peach{background:var(--peach);box-shadow:0 4px 0 var(--peach-deep)}
.main.mint{background:var(--mint);box-shadow:0 4px 0 #6fbf8c}
.main:active,.more:active,.lang:active{transform:translateY(3px);box-shadow:none}
button:disabled{opacity:.5}
.msg{font-size:15px;min-height:1.2em;color:var(--soft)}
.msg.ok{color:var(--mint-deep)} .msg.err{color:var(--peach-deep)}
.note{font-size:13px;color:var(--soft);margin:0}
.note a{color:var(--peach-deep)}

/* people lists */
.seg{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.seg button{font-family:var(--display);font-size:16px;background:var(--bg);color:var(--soft);border:2px solid var(--line);border-radius:99px;padding:4px 14px;cursor:pointer}
.seg button.on{background:var(--lilac);color:#3b2d55;border-color:var(--lilac)}
.people{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.person{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;background:var(--bg);border-radius:18px;padding:10px 12px}
.ava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:18px;color:#4a3b35}
.pname{font-family:var(--display);font-size:17px;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.pmeta{font-size:13px;color:var(--soft)}
.bar{height:10px;border-radius:99px;background:var(--ring-bg);overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--peach);width:0}
.pct{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;text-align:right}
.star{display:inline-block;width:18px;height:18px;vertical-align:-3px}
.total{display:flex;justify-content:space-between;font-family:var(--display);font-size:17px;margin-top:12px;padding:0 4px}
.empty{color:var(--soft);font-size:14px;text-align:center;padding:10px}
.log{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.log li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;border-bottom:2px dashed var(--line);padding:6px 2px;font-size:15px}
.log .d{color:var(--soft);font-size:13px}
.log .m{font-family:var(--display);font-size:16px}
.chip{font-family:var(--display);font-size:14px;padding:1px 10px;border-radius:99px;background:var(--ring-bg);color:var(--peach-deep)}
.chip.full{background:var(--mint);color:#24563a}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="star" viewBox="0 0 24 24"><path d="M12 2.5l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 16.8 6.2 20l1.4-6.4L2.7 9.2l6.5-.7z" fill="#ffd166" stroke="#e9b43f" stroke-width="1.2" stroke-linejoin="round"/></symbol>
    <symbol id="spark" viewBox="0 0 24 24"><path d="M12 1c1 6 3 8 11 11-8 3-10 5-11 11-1-6-3-8-11-11 8-3 10-5 11-11z" fill="#ffd166"/></symbol>
    <symbol id="heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.8-8 11-8 11z" fill="#ff9f8a"/></symbol>
    <symbol id="pray" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="50" fill="#ffd166" opacity=".25"/>
      <path d="M26 112c3-13 13-20 25-21l9 4-5 17z" fill="#a8d8f0" stroke="#6fb3d6" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M94 112c-3-13-13-20-25-21l-9 4 5 17z" fill="#a8d8f0" stroke="#6fb3d6" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M60 10 C55 12 52 16 51 21 C47 22 45 27 45 31 C41 33 40 38 40 43 C37 46 36 52 37 58 L39 76 C40 86 47 94 56 96 L60 96 Z" fill="#ffdcbf" stroke="#e7a982" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M 60 10 C 65 12 68 16 69 21 C 73 22 75 27 75 31 C 79 33 80 38 80 43 C 83 46 84 52 83 58 L 81 76 C 80 86 73 94 64 96 L 60 96 Z" fill="#ffdcbf" stroke="#e7a982" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M51 21 L55 35 M45 31 L50 46 M40 43 L45 57 M 69 21 L 65 35 M 75 31 L 70 46 M 80 43 L 75 57" stroke="#e7a982" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M56 24 Q53 34 54 44" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".85"/>
    </symbol>
  </defs>
</svg>

<div class="wrap">
  <header class="top">
    <div class="church"><span class="logo"><img src="logo.png" alt="" width="40" height="40"></span><span class="cname">我們家教會</span></div>
    <button type="button" class="lang" id="langBtn" aria-label="Language">中文</button>
  </header>
  <div>
    <h1 data-t="title">함께 기도 달성표</h1>
    <p class="sub" id="goalLine"></p>
  </div>

  <figure class="verse">
    <blockquote lang="zh-Hant-TW">你們祈求，就給你們；尋找，就尋見；叩門，就給你們開門。</blockquote>
    <p class="vko" id="verseKo" lang="ko">구하라 그리하면 너희에게 주실 것이요 찾으라 그리하면 찾을 것이요 문을 두드리라 그리하면 너희에게 열릴 것이니</p>
    <figcaption id="verseRef">馬太福音 7:7</figcaption>
  </figure>

  <section class="hero" data-t-aria="pctAria" aria-label="">
    <svg class="sparkle" style="left:8%;top:14%" aria-hidden="true"><use href="#spark"/></svg>
    <svg class="sparkle s2" style="right:10%;top:22%" aria-hidden="true"><use href="#spark"/></svg>
    <svg class="sparkle s3" style="left:16%;bottom:34%;width:14px;height:14px" aria-hidden="true"><use href="#spark"/></svg>
    <div class="ring">
      <svg viewBox="0 0 220 220" aria-hidden="true">
        <circle cx="110" cy="110" r="94" fill="none" stroke="var(--ring-bg)" stroke-width="18"/>
        <circle id="ringFg" cx="110" cy="110" r="94" fill="none" stroke="url(#rg)" stroke-width="18" stroke-linecap="round" transform="rotate(-90 110 110)" stroke-dasharray="590.6" stroke-dashoffset="590.6"/>
        <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb4a2"/><stop offset="1" stop-color="#ffd166"/></linearGradient></defs>
      </svg>
      <div class="center">
        <svg class="hands" viewBox="0 0 120 120" aria-hidden="true"><use href="#pray"/></svg>
        <span class="lbl" data-t="today">오늘</span>
        <span class="big" id="pToday">–</span>
      </div>
    </div>
    <p class="cheer" id="cheer"></p>
    <div class="stats">
      <div class="stat"><span class="k" data-t="sGoal">전체 목표</span><b id="sGoal">–</b></div>
      <div class="stat"><span class="k" data-t="sDone">함께 기도한 시간</span><b id="sDone">–</b></div>
      <div class="stat"><span class="k" id="sLeftK" data-t="sLeft">남은 시간</span><b id="sLeft">–</b></div>
    </div>
    <p class="det" id="dToday"></p>
    <div class="yest"><span data-t="yesterday">어제</span><b id="pYest">–</b><span class="det" id="dYest"></span></div>
    <div class="btns">
      <button type="button" class="more" id="avgBtn" aria-expanded="false" aria-controls="avgBox" data-t="avgOpen">전체 평균 달성률</button>
      <button type="button" class="more alt" id="resBtn" aria-expanded="false" aria-controls="resBox" data-t="resOpen">모두의 결과 보기</button>
    </div>
  </section>

  <section class="card avgcard" id="avgBox" hidden>
    <h2><span class="dot" style="background:var(--sun)"><svg width="18" height="18" aria-hidden="true"><use href="#star"/></svg></span><span data-t="avgTitle">전체 회원 평균 달성률</span></h2>
    <div class="seg" role="group" id="avgSeg">
      <button type="button" data-p="0" class="on" data-t="today">오늘</button>
      <button type="button" data-p="1" data-t="yesterday">어제</button>
      <button type="button" data-p="7" data-t="week">최근 7일</button>
    </div>
    <div class="avgbig" id="avgPct">–</div>
    <div class="bar avgbar"><i id="avgFill"></i></div>
    <p class="avgline" id="avgLine"></p>
    <p class="note" id="avgNote"></p>
  </section>

  <section class="card" id="resBox" hidden>
    <h2><span class="dot" style="background:var(--lilac)"><svg width="18" height="18" aria-hidden="true"><use href="#star"/></svg></span><span data-t="resTitle">신자별 결과</span></h2>
    <div class="seg" role="group">
      <button type="button" data-p="0" class="on" data-t="today">오늘</button>
      <button type="button" data-p="1" data-t="yesterday">어제</button>
      <button type="button" data-p="7" data-t="week">최근 7일</button>
    </div>
    <ul class="people" id="resRows"></ul>
    <div class="total" id="resTotal"></div>
    <p class="note" id="resNote" style="margin-top:8px"></p>
  </section>

  <section class="card" id="regBox">
    <h2><span class="dot" style="background:var(--mint)"><svg width="18" height="18" aria-hidden="true"><use href="#heart"/></svg></span><span data-t="regTitle">처음 오셨나요? 내 이름 등록</span></h2>
    <form id="r">
      <div class="fields">
        <label class="full"><span data-t="name">이름</span><input id="rName" maxlength="20" required></label>
        <label><span data-t="goalMin">하루 목표(분)</span><input id="rGoal" type="number" min="10" max="600" step="5" inputmode="numeric" value="60" required></label>
      </div>
      <button class="main mint" id="rSave" type="submit" data-t="regBtn">등록하기</button>
      <div class="msg" id="rMsg" role="status"></div>
      <p class="note" data-t="regNote">한 번만 등록하면 됩니다.</p>
    </form>
  </section>

  <section class="card">
    <h2><span class="dot" style="background:var(--peach)"><svg width="20" height="20" viewBox="0 0 120 120" aria-hidden="true"><use href="#pray"/></svg></span><span data-t="recTitle">기도 시간 기록</span></h2>
    <form id="f">
      <div class="fields">
        <label class="full"><span data-t="name">이름</span><select id="fName" required></select></label>
        <label><span data-t="date">날짜</span><input id="fDate" type="date" required></label>
        <label><span data-t="minutes">기도시간(분)</span><input id="fMin" type="number" min="0" max="1440" step="1" inputmode="numeric" required placeholder="60"></label>
      </div>
      <button class="main peach" id="fSave" type="submit" data-t="recBtn">기록하기</button>
      <div class="msg" id="fMsg" role="status"></div>
    </form>
  </section>

  <section class="card">
    <h2><span class="dot" style="background:var(--sky)"><svg width="18" height="18" aria-hidden="true"><use href="#spark"/></svg></span><span data-t="tableTitle">기록표</span> <span class="note" data-t="last14">(최근 14일)</span></h2>
    <ul class="log" id="rows"></ul>
  </section>
  <p class="note"><span data-t="formula"></span> <a href="install.html" data-t="installLink">설치 안내</a></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, collection, query, where, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const T = {
  ko: { title:"함께 기도 달성표", today:"오늘", yesterday:"어제", pctAria:"전체 목표 달성률",
    regTitle:"처음 오셨나요? 내 이름 등록", name:"이름", goalMin:"하루 목표(분)", regBtn:"등록하기",
    regNote:"한 번만 등록하면 됩니다. 이름이 틀렸거나 지워야 하면 목사님께 말씀해 주세요.", namePh:"예: 김은혜",
    recTitle:"기도 시간 기록", date:"날짜", minutes:"기도시간(분)", recBtn:"기도했어요! 기록하기",
    tableTitle:"기록표", last14:"(최근 14일)",
    formula:"달성률 = 그날 모두가 기도한 시간의 합 ÷ 모두의 하루 목표 합. 같은 날 다시 기록하면 새 값으로 바뀝니다.",
    installLink:"휴대폰에 설치하는 방법", other:"中文",
    avgOpen:"전체 평균 달성률", avgClose:"평균 닫기", avgTitle:"전체 회원 평균 달성률",
    avgLine:(d,n)=>`목표를 다 채운 사람 ${d}명 / 전체 ${n}명`,

    loadingMembers:"명단을 불러오는 중…", loading:"기록을 불러오는 중…", netSlow:"인터넷 연결을 확인해 주세요.",

    recBad:"이름, 날짜, 기도시간(0~1440분)을 확인해 주세요.", recOk:(n,d,t)=>`${n} · ${d} · ${t} 기록했어요. 잘했어요!`,
    recFail:"저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.",
    regBadName:"이름을 1~20자로 적어 주세요.", regBadGoal:"하루 목표는 10분에서 600분 사이로 적어 주세요.",
    regDup:n=>`‘${n}’ 이름이 이미 있어요. 본인이면 아래에서 이름을 고르세요. 다른 사람이면 이름 뒤에 구분(예: 김은혜B)을 붙여 주세요.`,
    regOk:n=>`${n}님, 반가워요! 이제 아래에서 기도 시간을 기록하세요.`, regFail:"등록하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요." },
  zh: { title:"一起禱告達成表", today:"今天", yesterday:"昨天", pctAria:"全體目標達成率",
    regTitle:"第一次使用嗎？登記我的名字", name:"姓名", goalMin:"每日目標（分鐘）", regBtn:"登記",
    regNote:"只需要登記一次。名字寫錯或需要刪除時，請告訴牧師。", namePh:"例如：王小明",
    recTitle:"記錄禱告時間", date:"日期", minutes:"禱告時間（分鐘）", recBtn:"我禱告了！記錄",
    tableTitle:"紀錄表", last14:"（最近14天）",
    formula:"達成率 = 當天大家禱告時間的總和 ÷ 大家每日目標的總和。同一天再次記錄時，會改成新的數值。",

    avgOpen:"全體平均達成率", avgClose:"收起平均", avgTitle:"全體會員平均達成率",
    avgLine:(d,n)=>`達成目標的人 ${d} 人 / 全體 ${n} 人`,
    avgNote:p=>"平均達成率 = 每位會員達成率的總和 ÷ 人數" + (p===7?"（最近7天以每日目標 × 7天計算）":"") + "。超過目標的人會計算為超過100%。",
    sGoal:"今天全體目標", sDone:"一起禱告了", sLeft:"還差", sOver:"超過目標", verseRef:"馬太福音 7:7",
    resOpen:"查看大家的結果", resClose:"收起結果", resTitle:"大家的禱告", week:"最近7天", total:"全體合計",
    resNote:p=>p===7?"最近7天 = 包含今天共7天 · 目標為每日目標 × 7天":"還沒有記錄的人會顯示為0分鐘。",
    goalLine:(n,g)=>`一起禱告 ${n} 人 · 今天目標 ${g}`, noMembers:"還沒有人登記。請在下方登記你的名字！",
    loadingMembers:"正在讀取名單…", loading:"正在讀取紀錄…", netSlow:"請確認網路連線。",
    loadFail:"無法讀取紀錄。", membersFail:"無法讀取名單。",
    empty:"還沒有紀錄。來記錄第一次禱告吧！",
    goalOpt:(n,g)=>`${n}（目標 ${g} 分鐘）`, h:"小時", m:"分鐘",
    cheer:p=>p>=100?"達成目標！感謝上帝":p>=70?"快要達成了！再加油一點":p>=30?"做得很好！一起加油":p>0?"禱告開始了！":"今天也一起禱告吧",
    recBad:"請確認姓名、日期、禱告時間（0～1440分鐘）。", recOk:(n,d,t)=>`${n} · ${d} · ${t} 已記錄。做得好！`,
    recFail:"儲存失敗。請確認網路連線後再按一次。",
    regBadName:"請輸入1～20個字的名字。", regBadGoal:"每日目標請輸入10到600分鐘。",
    regDup:n=>`「${n}」已經有人登記。如果是你本人，請在下方選擇名字；如果是別人，請在名字後面加上區別（例如：王小明B）。`,
    regOk:n=>`${n}，歡迎你！現在可以在下方記錄禱告時間。`, regFail:"登記失敗。請確認網路連線後再按一次。" }
};
let lang = "ko";
try { lang = localStorage.getItem("prayer.lang") || ""; } catch (e) {}
if (lang !== "ko" && lang !== "zh") lang = (navigator.languages || [navigator.language || ""]).some(l => /^zh/i.test(l)) ? "zh" : "ko";
const t = k => T[lang][k];
const status = { today: "loading", members: "loadingMembers" };

const app = initializeApp({
  apiKey: "AIzaSyAALHdScHzNF3iWGXn9JS6YjLya0NBjPW4",
  authDomain: "ourfamily-prayer-11060015.firebaseapp.com",
  projectId: "ourfamily-prayer-11060015",
  appId: "1:1029683333155:web:4675bfed8d72e770d34996",
  messagingSenderId: "1029683333155"
});
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const newId = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), b => "abcdefghijklmnopqrstuvwxyz0123456789"[b % 36]).join("");
const pad = n => String(n).padStart(2, "0");
const dstr = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return dstr(d); };
const fmtMin = m => { m = +m || 0; const h = Math.floor(m / 60), r = m % 60; return h ? h + t("h") + (r ? " " + r + t("m") : "") : r + t("m"); };
const COLORS = ["#ffb4a2", "#ffd166", "#a8d8f0", "#b8e6c8", "#d7c4f0", "#ffc9de"];
const colorFor = s => COLORS[[...s].reduce((a, c) => a + c.codePointAt(0), 0) % COLORS.length];
const CIRC = 590.6;
let members = [], entries = [], loadedMembers = false, loadedEntries = false, period = 0;

const totalGoal = () => members.reduce((s, m) => s + (+m.goal || 0), 0);
function pctFor(date) {
  const g = totalGoal(), keep = new Set(members.map(m => m.id));
  const sum = entries.filter(e => e.date === date && keep.has(e.member)).reduce((s, e) => s + e.minutes, 0);
  return { sum, g, p: g ? Math.round(sum / g * 100) : 0 };
}
function starEl() { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("class", "star"); s.setAttribute("aria-hidden", "true"); const u = document.createElementNS("http://www.w3.org/2000/svg", "use"); u.setAttribute("href", "#star"); s.appendChild(u); return s; }

function render() {
  const tp = pctFor(daysAgo(0)), y = pctFor(daysAgo(1));
  $("pToday").textContent = loadedEntries ? tp.p + "%" : "–";
  $("ringFg").setAttribute("stroke-dashoffset", String(CIRC * (1 - Math.min(100, loadedEntries ? tp.p : 0) / 100)));
  $("cheer").textContent = loadedEntries ? t("cheer")(tp.p) : "";
  $("dToday").textContent = loadedEntries ? "" : t(status.today);
  $("sGoal").textContent = loadedMembers ? fmtMin(tp.g) : "–";
  $("sDone").textContent = loadedEntries ? fmtMin(tp.sum) : "–";
  const left = tp.g - tp.sum;
  $("sLeftK").textContent = left < 0 ? t("sOver") : t("sLeft");
  $("sLeft").textContent = loadedEntries && loadedMembers ? (left < 0 ? "+" + fmtMin(-left) : fmtMin(left)) : "–";
  $("sLeft").parentElement.classList.toggle("done", loadedEntries && left <= 0 && tp.g > 0);
  $("pYest").textContent = loadedEntries ? y.p + "%" : "–";
  $("dYest").textContent = loadedEntries ? fmtMin(y.sum) + " / " + fmtMin(y.g) : "";
  $("goalLine").textContent = !loadedMembers ? t(status.members) : members.length ? t("goalLine")(members.length, fmtMin(totalGoal())) : t("noMembers");
  let mine = null; try { mine = localStorage.getItem("prayer.member"); } catch (e) {}
  $("regBox").hidden = !!(mine && members.some(m => m.id === mine));
  const s = $("fName"), cur = s.value; s.textContent = "";
  members.forEach(m => { const o = document.createElement("option"); o.value = m.id; o.textContent = t("goalOpt")(m.name, m.goal); s.appendChild(o); });
  if (cur && members.some(m => m.id === cur)) s.value = cur; else if (mine && members.some(m => m.id === mine)) s.value = mine;
  renderResults();
  renderAvg();
  const name = id => (members.find(m => m.id === id) || {}).name;
  const ul = $("rows"); ul.textContent = "";
  const list = entries.filter(e => name(e.member)).sort((a, b) => b.date.localeCompare(a.date) || name(a.member).localeCompare(name(b.member)));
  if (!list.length) { ul.appendChild(el("li", "empty", t("empty"))); return; }
  list.forEach(e => {
    const li = el("li"), p = pctFor(e.date).p;
    const who = el("div"); who.append(el("div", "", name(e.member)), el("div", "d", e.date));
    li.append(who, el("span", "m", fmtMin(e.minutes)), el("span", "chip" + (p >= 100 ? " full" : ""), p + "%"));
    ul.appendChild(li);
  });
}

function renderResults() {
  if ($("resBox").hidden) return;
  const dates = period === 7 ? Array.from({ length: 7 }, (_, i) => daysAgo(i)) : [daysAgo(period)];
  const set = new Set(dates), span = dates.length;
  const rows = members.map(m => {
    const mins = entries.filter(e => e.member === m.id && set.has(e.date)).reduce((s, e) => s + e.minutes, 0);
    const goal = m.goal * span;
    return { name: m.name, mins, goal, p: goal ? Math.round(mins / goal * 100) : 0 };
  }).sort((a, b) => b.p - a.p || a.name.localeCompare(b.name));
  const ul = $("resRows"); ul.textContent = "";
  if (!rows.length) ul.appendChild(el("li", "empty", t("noMembers")));
  rows.forEach(r => {
    const li = el("li", "person");
    const ava = el("div", "ava", [...r.name][0] || "?"); ava.style.background = colorFor(r.name);
    const mid = el("div"); const nm = el("div", "pname", r.name); if (r.p >= 100) { nm.append(" "); nm.appendChild(starEl()); }
    const bar = el("div", "bar"); const fill = el("i"); fill.style.width = Math.min(100, r.p) + "%"; if (r.p >= 100) fill.style.background = "var(--mint)"; bar.appendChild(fill);
    mid.append(nm, el("div", "pmeta", fmtMin(r.mins) + " / " + fmtMin(r.goal)), bar);
    li.append(ava, mid, el("div", "pct", r.p + "%")); ul.appendChild(li);
  });
  const sm = rows.reduce((s, r) => s + r.mins, 0), sg = rows.reduce((s, r) => s + r.goal, 0);
  const tot = $("resTotal"); tot.textContent = "";
  tot.append(el("span", "", t("total") + " · " + fmtMin(sm) + " / " + fmtMin(sg)), el("span", "", (sg ? Math.round(sm / sg * 100) : 0) + "%"));
  $("resNote").textContent = t("resNote")(period);
  document.querySelectorAll("#resBox .seg button").forEach(b => b.classList.toggle("on", +b.dataset.p === period));
}

// ---------- average of each member's personal achievement ----------
let avgPeriod = 0;
function memberRates(p) {
  const dates = p === 7 ? Array.from({ length: 7 }, (_, i) => daysAgo(i)) : [daysAgo(p)];
  const set = new Set(dates), span = dates.length;
  return members.map(m => {
    const mins = entries.filter(e => e.member === m.id && set.has(e.date)).reduce((s, e) => s + e.minutes, 0);
    const goal = m.goal * span;
    return goal ? mins / goal * 100 : 0;
  });
}
function renderAvg() {
  if ($("avgBox").hidden) return;
  const rates = memberRates(avgPeriod), n = rates.length;
  const avg = n ? Math.round(rates.reduce((s, r) => s + r, 0) / n) : 0;
  $("avgPct").textContent = loadedEntries && loadedMembers ? avg + "%" : "–";
  $("avgFill").style.width = Math.min(100, avg) + "%";
  $("avgLine").textContent = n ? t("avgLine")(rates.filter(r => r >= 100).length, n) : t("noMembers");
  $("avgNote").textContent = t("avgNote")(avgPeriod);
  document.querySelectorAll("#avgSeg button").forEach(b => b.classList.toggle("on", +b.dataset.p === avgPeriod));
}
$("avgBtn").addEventListener("click", () => {
  const open = $("avgBox").hidden;
  $("avgBox").hidden = !open; $("avgBtn").setAttribute("aria-expanded", String(open));
  $("avgBtn").textContent = t(open ? "avgClose" : "avgOpen");
  renderAvg();
  if (open) $("avgBox").scrollIntoView({ behavior: "smooth", block: "start" });
});
document.querySelectorAll("#avgSeg button").forEach(b => b.addEventListener("click", () => { avgPeriod = +b.dataset.p; renderAvg(); }));

function applyLang() {
  document.documentElement.lang = lang === "zh" ? "zh-Hant-TW" : "ko";
  document.title = t("title");
  document.querySelectorAll("[data-t]").forEach(n => { n.textContent = t(n.dataset.t); });
  document.querySelectorAll("[data-t-aria]").forEach(n => n.setAttribute("aria-label", t(n.dataset.tAria)));
  $("rName").placeholder = t("namePh");
  $("verseKo").hidden = lang !== "ko";
  $("verseRef").textContent = t("verseRef");
  $("langBtn").textContent = t("other");
  $("resBtn").textContent = t($("resBox").hidden ? "resOpen" : "resClose");
  $("avgBtn").textContent = t($("avgBox").hidden ? "avgOpen" : "avgClose");
  render();
}

$("resBtn").addEventListener("click", () => {
  const open = $("resBox").hidden;
  $("resBox").hidden = !open; $("resBtn").setAttribute("aria-expanded", String(open));
  $("resBtn").textContent = t(open ? "resClose" : "resOpen");
  renderResults();
  if (open) $("resBox").scrollIntoView({ behavior: "smooth", block: "start" });
});
document.querySelectorAll("#resBox .seg button").forEach(b => b.addEventListener("click", () => { period = +b.dataset.p; renderResults(); }));
$("langBtn").addEventListener("click", () => { lang = lang === "ko" ? "zh" : "ko"; try { localStorage.setItem("prayer.lang", lang); } catch (e) {} applyLang(); });
$("fDate").value = daysAgo(0);
applyLang();

const timer = setTimeout(() => { status.today = "netSlow"; render(); }, 10000);
onSnapshot(collection(db, "members"), s => {
  loadedMembers = true;
  members = s.docs.map(d => ({ id: d.id, name: String(d.data().name), goal: +d.data().goal || 0 })).sort((a, b) => a.name.localeCompare(b.name));
  render();
}, () => { status.members = "membersFail"; render(); });
onSnapshot(query(collection(db, "entries"), where("date", ">=", daysAgo(13))), s => {
  clearTimeout(timer); loadedEntries = true;
  entries = s.docs.map(d => d.data()).map(e => ({ date: String(e.date), member: String(e.member), minutes: +e.minutes || 0 }));
  render();
}, () => { clearTimeout(timer); status.today = "loadFail"; render(); });

const say = (id, txt, cls) => { const n = $(id); n.textContent = txt; n.className = "msg" + (cls ? " " + cls : ""); };
$("r").addEventListener("submit", async ev => {
  ev.preventDefault();
  const name = $("rName").value.trim().replace(/\s+/g, " "), goal = Math.round(+$("rGoal").value);
  if (!name || name.length > 20) { say("rMsg", t("regBadName"), "err"); return; }
  if (!(goal >= 10 && goal <= 600)) { say("rMsg", t("regBadGoal"), "err"); return; }
  if (members.some(m => m.name === name)) { say("rMsg", t("regDup")(name), "err"); return; }
  $("rSave").disabled = true;
  const id = newId();
  try {
    await setDoc(doc(db, "members", id), { name, goal });
    try { localStorage.setItem("prayer.member", id); } catch (e) {}
    say("rMsg", t("regOk")(name), "ok"); $("rName").value = "";
    setTimeout(() => { $("fName").value = id; }, 300);
  } catch (e) { say("rMsg", t("regFail"), "err"); }
  finally { $("rSave").disabled = false; }
});
$("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const member = $("fName").value, date = $("fDate").value, minutes = Math.round(+$("fMin").value);
  if (!member || !/^\d{4}-\d{2}-\d{2}$/.test(date) || !(minutes >= 0 && minutes <= 1440)) { say("fMsg", t("recBad"), "err"); return; }
  try { localStorage.setItem("prayer.member", member); } catch (e) {}
  $("fSave").disabled = true;
  try {
    await setDoc(doc(db, "entries", date + "_" + member), { date, member, minutes });
    say("fMsg", t("recOk")((members.find(m => m.id === member) || {}).name || "", date, fmtMin(minutes)), "ok"); $("fMin").value = "";
  } catch (e) { say("fMsg", t("recFail"), "err"); }
  finally { $("fSave").disabled = false; }
});
</script>
